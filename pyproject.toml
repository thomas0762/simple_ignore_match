[project]
name = "simple-ignore-match"
version = "0.1.0"
description = "Check whether a path matches gitignore-style patterns, honoring last-match-wins order."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
